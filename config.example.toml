[input]
source = "mail"
timezone = "America/New_York"
lookback_hours = 24
search_query = "from:${GEMINI_NOTES_SENDER} subject:Notes"
search_command = [
  "${MAIL_CLI}",
  "gmail",
  "search",
  "-a",
  "${MAIL_ACCOUNT}",
  "--client",
  "${MAIL_CLIENT}",
  "-j",
  "--results-only",
  "{query}",
]
get_command = [
  "${MAIL_CLI}",
  "gmail",
  "get",
  "-a",
  "${MAIL_ACCOUNT}",
  "--client",
  "${MAIL_CLIENT}",
  "-j",
  "--results-only",
  "{message_id}",
]
command_env = {}

# Takeout mode (optional): set source = "takeout" and fill activity_json.
activity_json = "${NOTES_INTERROGATOR_ACTIVITY_JSON}"
conversation_id_pattern = "/app/(?:c|chat)/([^/?#]+)"

[run]
default_date = "today"

[llm]
base_url = "${LLM_BASE_URL}"
model = "${LLM_MODEL}"
api_key_env = "LLM_API_KEY"
prompt_path = "${XDG_CONFIG_HOME}/notes-interrogator/prompts/extract-tasks.md"
temperature = 0.2
max_input_chars = 120000

[tasks]
list_id = "${TASKS_LIST_ID}"
create_command = [
  "${TASKS_CLI}",
  "tasks",
  "add",
  "{list_id}",
  "--title",
  "{title}",
  "--notes",
  "{notes}",
]
create_command_env = {}
dry_run_env = "NOTES_INTERROGATOR_DRY_RUN"

[state]
path = "${XDG_DATA_HOME}/notes-interrogator/processed.json"
